{%- comment -%} "What people have tried in the past": one row per approach, revealed one click at a time, as on the slide. {%- endcomment -%} {%-
assign ep_img = '/assets/img/embodied-programming/' | relative_url -%}
<figure
  class="ep-fig ep-stepper ep-approaches l-body"
  data-ep="stepper"
  tabindex="0"
  aria-label="What earlier approaches to modeling a robot body need, compared with Neural Jacobian Fields"
>
  <div class="ep-card">
    <div class="ep-bar ep-needs-js">
      <span class="ep-kicker">What each approach needs</span><span class="ep-spacer"></span><span class="ep-dots"></span
      ><button type="button" class="ep-btn ep-play" aria-pressed="true" aria-label="Pause the animation">❚❚</button
      ><button type="button" class="ep-btn ep-prev" aria-label="Previous step">←</button
      ><button type="button" class="ep-btn ep-next" aria-label="Next step">→</button>
    </div>
    <div class="ep-stage ep-reveal ep-approaches__list">
      <div class="ep-tile ep-approach">
        <div class="ep-approach__img">
          <img
            src="{{ ep_img }}past_physics.webp"
            alt="A backbone model of a soft arm, and a soft arm holding an apple"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="ep-approach__who">
          <div class="ep-approach__name">Physics-based models</div>
          <div class="ep-approach__credit">Della Santina, Duriez &amp; Rus 2023</div>
        </div>
        <div class="ep-approach__what">
          <div class="ep-approach__needs">Needs</div>
          <div class="ep-approach__need">Expert knowledge</div>
          <div class="ep-approach__detail">Geometry, material properties, and simplifying assumptions</div>
        </div>
      </div>
      <div class="ep-tile ep-approach">
        <div class="ep-approach__img">
          <img src="{{ ep_img }}past_sensors.webp" alt="A soft arm with embedded sensors" loading="lazy" decoding="async" />
        </div>
        <div class="ep-approach__who">
          <div class="ep-approach__name">Sensors and markers</div>
          <div class="ep-approach__credit">Truby, Della Santina &amp; Rus 2020</div>
        </div>
        <div class="ep-approach__what">
          <div class="ep-approach__needs">Needs</div>
          <div class="ep-approach__need">Instrumentation</div>
          <div class="ep-approach__detail">Embedded sensors, or markers tracked by motion capture</div>
        </div>
      </div>
      <div class="ep-tile ep-approach">
        <div class="ep-approach__img">
          <img
            src="{{ ep_img }}past_shape.webp"
            alt="A robot arm imagining its own shape for different joint angles"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="ep-approach__who">
          <div class="ep-approach__name">Learned shape models</div>
          <div class="ep-approach__credit">Chen et al., Science Robotics 2022</div>
        </div>
        <div class="ep-approach__what">
          <div class="ep-approach__needs">Needs</div>
          <div class="ep-approach__need">Precise sensors</div>
          <div class="ep-approach__detail">Precise encoders, plus motion capture for fine control</div>
        </div>
      </div>
      <div class="ep-tile ep-approach ep-approach--ours">
        <div class="ep-approach__img">
          <img src="{{ ep_img }}past_njf.webp" alt="The pneumatic hand on a robot arm, seen by one camera" loading="lazy" decoding="async" />
        </div>
        <div class="ep-approach__who">
          <div class="ep-approach__name">Neural Jacobian Fields</div>
          <div class="ep-approach__credit">Li et al., Nature 2025</div>
        </div>
        <div class="ep-approach__what">
          <div class="ep-approach__needs">Needs</div>
          <div class="ep-approach__need">Vision alone</div>
          <div class="ep-approach__detail">Video of random commands to train; one camera to control</div>
        </div>
      </div>
    </div>
    <div class="ep-step" aria-live="polite"><span class="ep-step__n"></span><span class="ep-step__text"></span></div>
    <ol class="ep-captions">
      <li>Physics-based models: an expert builds the model by hand.</li>
      <li>Sensors and markers: the body itself is instrumented.</li>
      <li>Visual self-models learn the shape from cameras, but still take measured joint angles as input.</li>
      <li>Neural Jacobian Fields need vision alone. Nothing to model, build in, or measure.</li>
    </ol>
  </div>
  <figcaption class="caption">What each approach needs before it can control a new body.</figcaption>
</figure>
